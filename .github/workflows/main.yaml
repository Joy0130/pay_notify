name: Gmail LINE Notify

on:
  push:
    branches: [ main ]
  schedule:
    # 在奇數月份 (1,3,5,7,9,11 月) 的 1～11 號期間，
    # 台灣時間早上 07:30～07:59 之間，每 5 分鐘執行一次。
    # 對應 UTC 時間為前一天的 23:30～23:59。
    - cron: "30-59/5 23 1-11 1,3,5,7,9,11 *"
  
    # 在奇數月份 (1,3,5,7,9,11 月) 的 1～11 號期間，
    # 台灣時間下午 16:00～16:15 之間，每 5 分鐘執行一次。
    # 對應 UTC 時間為當天的 08:00～08:15。
    - cron: "0-15/5 8 1-11 1,3,5,7,9,11 *"
    
    - cron: "30-59/5 7 16-19 1,3,5,7,9,11 *" # 處理 TT 15:30-15:59
    - cron: "0-15/5 8 16-19 1,3,5,7,9,11 *"   # 處理 TT 16:00-16:15
  workflow_dispatch:  # 手動觸發

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install imapclient python-dotenv requests

      - name: Run Gmail Notify
        env:
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          echo "執行時間 (UTC): $(date)"
          echo "執行 pay_notify.py..."
          python pay_notify.py
