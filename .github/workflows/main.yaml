name: Gmail LINE Notify (Odd Months, 1-12 Days, 5min Interval)

on:
  schedule:
    # 每分鐘跑一次，workflow 裡會判斷 5 分鐘間隔
    - cron: "*/1 6-8 1-12 1,3,5,7,9,11 *"
  workflow_dispatch:  # 手動觸發

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install imapclient python-dotenv requests

      - name: Run Gmail Notify
        env:
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          # 取得台灣時間
          TZ="Asia/Taipei"
          HOUR=$(date +"%H")
          MINUTE=$(date +"%M")
          DAY=$(date +"%d")

          # 只在每月1~12號、14:00~16:00、每5分鐘執行
          if [ "$DAY" -ge 1 ] && [ "$DAY" -le 12 ] && [ "$HOUR" -ge 14 ] && [ "$HOUR" -lt 16 ]; then
              if [ $((10#$MINUTE % 5)) -eq 0 ]; then
                  echo "執行 pay_notify.py"
                  python pay_notify.py
              else
                  echo "不在5分鐘倍數，跳過執行"
              fi
          else
              echo "不在 1~12號或 14:00~16:00 時間段，跳過執行"
          fi
