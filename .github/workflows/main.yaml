name: Gmail LINE Notify

on:
  schedule:
    # 在奇數月份的1-12號，UTC時間 6:00-7:59 (台灣時間 14:00-15:59)，每5分鐘執行一次
    - cron: "*/5 6,7 1-12 1,3,5,7,9,11 *"
  workflow_dispatch:  # 手動觸發

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install imapclient python-dotenv requests

      - name: Run Gmail Notify
        env:
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          echo "執行時間 (UTC): $(date)"
          echo "執行 pay_notify.py..."
          python pay_notify.py
