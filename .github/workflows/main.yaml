name: Gmail LINE Notify (Odd Months, 10min Interval)

on:
  schedule:
    # 測試每 1 分鐘執行一次
    - cron: "*/1 * 1,3,5,7,9,11 * *"
  workflow_dispatch:  # 手動觸發

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install imapclient python-dotenv requests

      - name: Run Gmail Notify
        env:
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          # 取得台灣時間
          HOUR=$(TZ="Asia/Taipei" date +"%H")
          MINUTE=$(TZ="Asia/Taipei" date +"%M")

          # 台灣時間 14:00 ~ 16:00，每 10 分鐘檢查一次
          if [ "$HOUR" -ge 14 ] && [ "$HOUR" -lt 16 ]; then
              if [ $((10#$MINUTE % 10)) -eq 0 ]; then
                  python pay_notify.py
              else
                  echo "不在整10分鐘，跳過執行"
              fi
          else
              echo "不在 14:00~16:00 時間段，跳過執行"
          fi
