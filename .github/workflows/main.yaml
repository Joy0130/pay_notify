name: Gmail LINE Notify

on:
  push:
    branches: [ main ]
  schedule:
    # 在奇數月份，台灣時間早上 7:30-8:30 (對應 UTC 前一天的 23:30-23:59 和當天的 00:00-00:30) 每3分鐘執行一次
    # 注意：因為跨日，日期設定會對應到 UTC 的前一天。
    - cron: "30-59/3 23 * 1,3,5,7,9,11 *" # 處理 TT 07:30-07:59
    # 在奇數月份，台灣時間下午 3:30-4:15 (對應 UTC 07:30-07:59 和 08:00-08:15) 每3分鐘執行一次
    - cron: "30-59/3 7 * 1,3,5,7,9,11 *" # 處理 TT 15:30-15:59
    - cron: "0-15/3 8 * 1,3,5,7,9,11 *"   # 處理 TT 16:00-16:15
  workflow_dispatch:  # 手動觸發

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install imapclient python-dotenv requests

      - name: Run Gmail Notify
        env:
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          echo "執行時間 (UTC): $(date)"
          echo "執行 pay_notify.py..."
          python pay_notify.py
